#__IMAGEN__ y __VERSION__ los reemplaza el pipeline con sed antes de aplicar, nunca usamos latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisur-app
  namespace: medisur
  labels:
    app: medisur-app
spec:
  #minimo dos replicas para que la app siga arriba si se cae un pod
  replicas: 2
  #guardamos las ultimas versiones para poder hacer rollout undo
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: medisur-app
  #actualizacion gradual: primero levantamos un pod nuevo y hasta que este listo quitamos uno viejo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: medisur-app
        version: "__VERSION__"
      annotations:
        #prometheus usa esta anotacion para saber que pods leer
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      #si el paquete de ghcr es privado, este secreto tiene las credenciales para descargar la imagen
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: medisur-app
          image: __IMAGEN__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: medisur-config
            #el secreto se crea a mano en el cluster, en el repo solo esta la plantilla
            - secretRef:
                name: medisur-secret
                optional: true
          #sonda de vitalidad: si /health deja de responder, kubernetes reinicia el contenedor
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          #sonda de disponibilidad: el pod no recibe trafico hasta que /ready responde
          readinessProbe:
            httpGet:
              path: /listo #cambio para error
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          #limitamos recursos para que un pod no se coma la vm de 2 vcpu
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
