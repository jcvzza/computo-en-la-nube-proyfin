#exponemos la app por el puerto 30080 de la vm, el service reparte el trafico entre las replicas listas
apiVersion: v1
kind: Service
metadata:
  name: medisur-app
  namespace: medisur
  labels:
    app: medisur-app
spec:
  type: NodePort
  selector:
    app: medisur-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
