#plantilla, no tiene valores reales y no se aplica con kubectl apply -f k8s/
#el secreto real se crea directo en el cluster:
#  kubectl -n medisur create secret generic medisur-secret --from-literal=SECRET_KEY=<valor>
apiVersion: v1
kind: Secret
metadata:
  name: medisur-secret
  namespace: medisur
type: Opaque
stringData:
  SECRET_KEY: "CAMBIAR_EN_EL_CLUSTER"
