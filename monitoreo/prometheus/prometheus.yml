#prometheus corre en vm-tools, fuera del cluster, para que el monitoreo no caiga junto con lo que vigila
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/reglas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  #prometheus se vigila a si mismo
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  #node_exporter de las dos vms: cpu, memoria, disco, red y tiempo encendido
  - job_name: nodos
    static_configs:
      - targets: ["vm-tools:9100"]
        labels:
          vm: vm-tools
      - targets: ["vm-k8s:9100"]
        labels:
          vm: vm-k8s

  #pods de la app: los descubrimos con la api de k3s y leemos /metrics pasando por la misma api
  - job_name: medisur-app
    kubernetes_sd_configs:
      - role: pod
        api_server: https://vm-k8s:6443
        namespaces:
          names: [medisur]
        authorization:
          credentials_file: /etc/prometheus/secrets/k8s-token
        tls_config:
          ca_file: /etc/prometheus/secrets/k8s-ca.crt
    scheme: https
    authorization:
      credentials_file: /etc/prometheus/secrets/k8s-token
    tls_config:
      ca_file: /etc/prometheus/secrets/k8s-ca.crt
    relabel_configs:
      #solo los pods con la anotacion prometheus.io/scrape=true y que esten corriendo
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      #mandamos la peticion a la api de k3s, que la reenvia al pod
      - target_label: __address__
        replacement: vm-k8s:6443
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+);(.+)
        target_label: __metrics_path__
        replacement: /api/v1/namespaces/$1/pods/$2:$3/proxy/metrics
      #guardamos el nombre del pod y su version como etiquetas
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version

  #kube-state-metrics: replicas deseadas y listas, reinicios, estado de los pods
  - job_name: kube-state-metrics
    scheme: https
    metrics_path: /api/v1/namespaces/kube-system/services/kube-state-metrics:8080/proxy/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/k8s-token
    tls_config:
      ca_file: /etc/prometheus/secrets/k8s-ca.crt
    static_configs:
      - targets: ["vm-k8s:6443"]

  #cadvisor del nodo: cpu y memoria de cada pod
  - job_name: cadvisor
    kubernetes_sd_configs:
      - role: node
        api_server: https://vm-k8s:6443
        authorization:
          credentials_file: /etc/prometheus/secrets/k8s-token
        tls_config:
          ca_file: /etc/prometheus/secrets/k8s-ca.crt
    scheme: https
    authorization:
      credentials_file: /etc/prometheus/secrets/k8s-token
    tls_config:
      ca_file: /etc/prometheus/secrets/k8s-ca.crt
    relabel_configs:
      - target_label: __address__
        replacement: vm-k8s:6443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    #solo guardamos las series de la app para no llenar el disco
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: medisur
        action: keep
